services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: school_erp
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: erp_admin_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_admin -d school_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  erp_backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILE_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/school_erp
      SPRING_DATASOURCE_USERNAME: erp_admin
      SPRING_DATASOURCE_PASSWORD: erp_admin_password
    depends_on:
      - postgres

volumes:
  postgres-data: